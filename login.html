<!doctype html>
<html lang="mk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in</title>
<style>
  :root {
    color-scheme: dark;
    --void: #0a1116;
    --deck: #101a21;
    --deck-2: #16232b;
    --deck-3: #1c2c35;
    --line: rgba(151, 197, 195, 0.16);
    --line-strong: rgba(151, 197, 195, 0.34);
    --phosphor: #4bf3ae;
    --phosphor-dim: rgba(75, 243, 174, 0.14);
    --danger: #ff5c48;
    --danger-dim: rgba(255, 92, 72, 0.13);
    --text: #eaf5f2;
    --muted: #86a09e;
    --faint: #55716f;
  }
  html { overflow: hidden; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--void);
    position: relative;
  }
  .field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .field__grid {
    position: absolute;
    inset: -2px;
    background-image:
      repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 88px),
      repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 88px);
    opacity: 0.5;
    -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 42%, #000 0%, transparent 78%);
            mask-image: radial-gradient(ellipse 85% 70% at 50% 42%, #000 0%, transparent 78%);
  }
  .field__sweep {
    position: absolute;
    top: -35vw;
    left: 50%;
    width: 155vw;
    height: 155vw;
    margin-left: -77.5vw;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, rgba(75, 243, 174, 0.15) 344deg, rgba(75, 243, 174, 0.05) 356deg, transparent 360deg);
    animation: sweep 16s linear infinite;
  }
  @keyframes sweep {
    to { transform: rotate(360deg); }
  }
  .field__vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 90% 65% at 50% 38%, transparent 55%, var(--void) 100%);
  }
  @media (prefers-reduced-motion: reduce) {
    .field__sweep { animation: none; }
  }
  .brand-lockup,
  .corner-date,
  .copyright {
    position: fixed;
    z-index: 1;
  }
  .brand-lockup {
    top: 1.25rem;
    left: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .brand-detail {
    color: var(--phosphor);
    font: 600 0.62rem/1.2 "Segoe UI", sans-serif;
    letter-spacing: 0.2em;
  }
  .language-control {
    position: fixed;
    z-index: 1;
    bottom: 1.25rem;
    left: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
  }
  .corner-date,
  .copyright {
    color: var(--faint);
    font: 0.7rem/1.3 "Segoe UI", sans-serif;
    letter-spacing: 0.04em;
  }
  .corner-date { top: 1.25rem; right: 1.5rem; }
  .copyright { bottom: 1.25rem; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .console {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    border: 1px solid var(--line-strong);
    background: linear-gradient(180deg, rgba(22, 35, 43, 0.92), rgba(13, 21, 27, 0.96));
    clip-path: polygon(0 16px, 16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(0, 0, 0, 0.4);
    animation: form-arrival 700ms cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes form-arrival {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .console__bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .console__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); opacity: 0.55; }
  .console__dot--live { background: var(--phosphor); opacity: 1; box-shadow: 0 0 8px var(--phosphor); }
  .console__barTitle { color: var(--muted); }
  form {
    padding: 1.75rem 1.6rem 1.9rem;
  }
  .eyebrow {
    display: block;
    margin-bottom: 1.1rem;
    color: var(--phosphor);
    font: 600 0.66rem/1.2 "Segoe UI", sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .topline { display: flex; align-items: center; justify-content: flex-end; gap: 1rem; }
  .language-label { color: var(--muted); font-size: 0.7rem; }
  select {
    padding: 0.38rem 1.8rem 0.38rem 0.55rem;
    border: 1px solid var(--line-strong);
    outline: none;
    background: var(--deck-2);
    color: var(--text);
    font: inherit;
    font-size: 0.75rem;
    cursor: pointer;
  }
  h1 { font-size: clamp(1.7rem, 5vw, 2.2rem); letter-spacing: -0.03em; margin: 0.2rem 0 0.7rem; text-align: center; }
  .intro { color: var(--muted); line-height: 1.55; margin: 0 0 1.8rem; font-size: 0.9rem; text-align: center; }
  .google-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: min(100%, 300px);
    margin: 0 auto;
    padding: 0.8rem 1.1rem;
    background: var(--deck-2);
    color: var(--text);
    border: 1px solid var(--line-strong);
    box-shadow: none;
    font-family: "Segoe UI", sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .google-mark {
    display: grid;
    place-items: center;
    width: 1.85rem;
    height: 1.85rem;
    background: transparent;
    background-image: linear-gradient(135deg, #4285f4 15%, #34a853 42%, #fbbc05 67%, #ea4335 88%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font: 700 1.4rem/1 Arial, sans-serif;
    transform: translateY(-0.02em);
  }
  button {
    width: 100%;
    margin-top: 1.7rem;
    padding: 0.82rem;
    border: none;
    background: var(--phosphor);
    color: var(--void);
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
  }
  button:hover:not(:disabled) {
    background: #7ef7c4;
    box-shadow: 0 8px 24px var(--phosphor-dim);
    transform: translateY(-1px);
  }
  .google-button:hover:not(:disabled) {
    background: var(--phosphor-dim);
    color: var(--phosphor);
    border-color: var(--phosphor);
    box-shadow: none;
    transform: translateY(-1px);
  }
  .google-button:focus-visible {
    outline: 3px solid var(--phosphor-dim);
    outline-offset: 3px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .note {
    position: fixed;
    z-index: 1;
    bottom: 3.15rem;
    left: 50%;
    width: max-content;
    max-width: calc(100vw - 3rem);
    margin: 0;
    transform: translateX(-50%);
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
  }
  #message {
    position: fixed;
    z-index: 5;
    left: 1.5rem;
    bottom: 4.35rem;
    width: max-content;
    max-width: min(440px, calc(100vw - 3rem));
    display: flex;
    align-items: flex-start;
    gap: 0.55rem;
    margin: 0;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--line-strong);
    background: var(--deck);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.3);
    color: var(--muted);
    text-align: left;
    font: 0.72rem/1.4 "Segoe UI", sans-serif;
  }
  #message:empty { display: none; }
  #message::before {
    content: "";
    flex: 0 0 7px;
    width: 7px;
    height: 7px;
    margin-top: 0.2rem;
    border-radius: 50%;
    background: var(--faint);
  }
  #message.error { border-color: rgba(255, 92, 72, 0.32); color: #ffb4a8; }
  #message.error::before { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-dim); }
  #message.ok { color: #9ffcd2; }
  #message.ok::before { background: var(--phosphor); box-shadow: 0 0 0 3px var(--phosphor-dim); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="field" aria-hidden="true">
    <div class="field__grid"></div>
    <div class="field__sweep"></div>
    <div class="field__vignette"></div>
  </div>
  <div class="brand-lockup" aria-label="Secure access">
    <span class="brand-detail">SECURE ACCESS</span>
  </div>
  <time class="corner-date" id="current-date" datetime="2026-09-07">September 7, 2026</time>
  <div class="language-control">
    <label class="language-label" for="language">Language</label>
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="mk">Македонски</option>
      <option value="sv">Svenska</option>
    </select>
  </div>

  <div class="console">
    <div class="console__bar">
      <span class="console__dot"></span><span class="console__dot"></span><span class="console__dot console__dot--live"></span>
      <span class="console__barTitle">Secure Access // Sign-in</span>
    </div>
    <form id="auth-form">
      <h1 id="form-title">Welcome back</h1>
      <p class="intro" id="intro">This is where your next adventure begins.</p>

      <button class="google-button" type="submit" id="submit-btn">
        <span class="google-mark" aria-hidden="true">G</span>
        <span id="button-text">Continue with Google</span>
      </button>
    </form>
  </div>

  <div id="message" role="status" aria-live="polite"></div>
  <p class="note" id="note">Authentication is handled securely by Google.</p>

  <footer class="copyright" id="copyright">All rights reserved 2026</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const hasSupabaseConfig = typeof SUPABASE_URL === "string" && SUPABASE_URL.startsWith("http");
    const client = hasSupabaseConfig
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;
    const isWebOrigin = window.location.protocol === "http:" || window.location.protocol === "https:";

    const form = document.getElementById("auth-form");
    const title = document.getElementById("form-title");
    const submitBtn = document.getElementById("submit-btn");
    const buttonText = document.getElementById("button-text");
    const intro = document.getElementById("intro");
    const note = document.getElementById("note");
    const language = document.getElementById("language");
    const message = document.getElementById("message");
    const currentDate = document.getElementById("current-date");
    const copyright = document.getElementById("copyright");

    const translations = {
      en: {
        title: "Ready to start?",
        intro: "This is where your next adventure begins.",
        language: "Language",
        button: "Sign in with Google",
        note: "Authentication is handled securely by Google.",
        error: "Google sign-in could not be started. Please try again.",
        locale: "en-US",
        rights: "All rights reserved"
      },
      mk: {
        title: "Подготвен си да започнеш?",
        intro: "Тука започнува твојата следна авантура.",
        language: "Јазик",
        button: "Најави се со Google",
        note: "Автентикацијата ја обработува Google на безбеден начин.",
        error: "Најавата со Google не можеше да започне. Обиди се повторно.",
        locale: "mk-MK",
        rights: "Сите права се задржани"
      },
      sv: {
        title: "Redo att börja?",
        intro: "Här börjar ditt nästa äventyr.",
        language: "Språk",
        button: "Logga in med Google",
        note: "Autentiseringen hanteras säkert av Google.",
        error: "Google-inloggningen kunde inte startas. Försök igen.",
        locale: "sv-SE",
        rights: "Alla rättigheter förbehållna"
      }
    };

    function setLanguage(nextLanguage) {
      const copy = translations[nextLanguage];
      document.documentElement.lang = nextLanguage;
      document.title = copy.title;
      title.textContent = copy.title;
      intro.textContent = copy.intro;
      document.querySelector(".language-label").textContent = copy.language;
      language.setAttribute("aria-label", copy.language);
      buttonText.textContent = copy.button;
      note.textContent = copy.note;
      currentDate.textContent = new Intl.DateTimeFormat(copy.locale, {
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(new Date());
      currentDate.dateTime = new Date().toISOString().slice(0, 10);
      copyright.textContent = `${copy.rights} ${new Date().getFullYear()}`;
      message.textContent = "";
      message.className = "";
    }
    language.addEventListener("change", () => setLanguage(language.value));
    setLanguage("en");

    // Already logged in? Skip straight to the hub.
    if (client) {
      client.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = "hub.html";
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      message.textContent = "";
      message.className = "";

      if (!client || !isWebOrigin) {
        message.textContent = translations[language.value].error;
        message.className = "error";
        submitBtn.disabled = false;
        return;
      }

      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: `${window.location.origin}/hub.html` }
      });
      if (error) {
        message.textContent = error.message;
        message.className = "error";
        submitBtn.disabled = false;
        return;
      }
    });
  </script>
</body>
</html>
